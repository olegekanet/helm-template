{{- range $appName, $app := .Values.groups.main.apps }}
{{- if $app.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $appName }}-ingress
  namespace: {{ $.Values.namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ $app.ingress.class }}
    cert-manager.io/cluster-issuer: {{ $.Values.groups.main.ingress.cluster_issuer }}
spec:
  rules:
    - host: {{ $app.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $appName }}-svc
                port:
                  number: {{ $app.targetport }}
  tls:
    - hosts:
        - {{ $app.ingress.host }}
      secretName: {{ $appName }}-tls
---
{{- end }}
{{- end }}
