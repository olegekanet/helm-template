{{- range $appName, $app := .Values.groups.main.apps }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ $appName  }}-test-connection"
  labels:
    {{- $appName | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ $appName }}:{{ $app.service.port }}']
  restartPolicy: Never
---
{{- end }}